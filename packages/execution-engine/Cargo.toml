[package]
name = "sentinel-execution-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "LicenseRef-Proprietary"
description = "Bounded supervision of Sentinel's trusted offline archive worker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "sentinel-execution"
path = "src/main.rs"
